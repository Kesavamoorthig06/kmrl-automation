<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yard Operations Portal - KMRL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            background: #f093fb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: bold;
        }
        
        h1 {
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        
        .status-card {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            margin: 1rem 0;
            border-left: 4px solid #f093fb;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            margin: 0.5rem 0;
            padding: 0.5rem 0;
            border-bottom: 1px solid #eee;
        }
        
        .status-item:last-child {
            border-bottom: none;
        }
        
        .status-label {
            color: #666;
            font-weight: 500;
        }
        
        .status-value {
            color: #333;
            font-weight: bold;
        }
        
        .actions {
            margin-top: 2rem;
        }
        
        .btn {
            background: #f093fb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            margin: 0.5rem;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn:hover {
            background: #e67ee6;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 147, 251, 0.4);
        }
        
        .btn-secondary {
            background: #6c757d;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .footer {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🚂</div>
        <h1>Yard Operations Portal</h1>
        <p class="subtitle">Kochi Metro Rail Limited</p>
        
        <div class="status-card">
            <h3 style="margin-bottom: 1rem; color: #333;">Yard Status</h3>
            <div class="status-item">
                <span class="status-label">Trains in Yard:</span>
                <span class="status-value">12</span>
            </div>
            <div class="status-item">
                <span class="status-label">Available Slots:</span>
                <span class="status-value">8</span>
            </div>
            <div class="status-item">
                <span class="status-label">Under Maintenance:</span>
                <span class="status-value">3</span>
            </div>
            <div class="status-item">
                <span class="status-label">Ready for Service:</span>
                <span class="status-value">9</span>
            </div>
        </div>
        
        <div class="actions">
            <a href="#" class="btn">Move Train</a>
            <a href="#" class="btn">Update Position</a>
            <a href="#" class="btn btn-secondary">Schedule Shunting</a>
        </div>
        
        <div class="footer">
            <p>© 2025 Kochi Metro Rail Limited. All rights reserved.</p>
            <p><a href="/login" style="color: #f093fb; text-decoration: none;">← Back to Login</a></p>
        </div>
    </div>
</body>
</html>
