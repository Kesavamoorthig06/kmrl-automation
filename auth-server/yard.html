<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yard Master - Stabling Bay Assignment</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f4f4f4;
      min-height: 100vh;
      padding: 10px;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      overflow: hidden;
    }

    .header {
      background: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      color: #000;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 18px;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    .header p {
      font-size: 14px;
      color: #666;
      font-weight: 400;
    }

    .main-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
    }

    .form-section,
    .map-section {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #e0e0e0;
    }

    .section-title {
      background: #fff;
      color: #333;
      font-size: 16px;
      margin-bottom: 15px;
      font-weight: 600;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #333;
      font-size: 1em;
    }

    input,
    select,
    textarea,
    button {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #333;
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.1);
    }

    .auto-field {
      background: #fafafa;
      color: #444;
      position: relative;
      font-weight: 500;
    }

    .auto-field::after {
      content: "AUTO";
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: #333;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75em;
      font-weight: 500;
    }

    .qr-scanner {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .qr-scanner input {
      flex: 1;
    }

    .dropdown-toggle {
      width: auto;
      background: #333;
      color: white;
      border: none;
      padding: 12px 16px;
      cursor: pointer;
      border-radius: 8px;
      font-weight: 500;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .dropdown-toggle:hover {
      background: #555;
    }

    .bay-selector {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .selector-tabs {
      display: flex;
      gap: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #f7f7f7;
      border: 1px solid #ccc;
      cursor: pointer;
      border-radius: 6px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: #333;
      border-color: #333;
      color: #fff;
    }

    .bay-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 8px;
      padding: 15px;
      background: #fafafa;
      border-radius: 8px;
      border: 1px solid #ccc;
      min-height: 280px;
    }

    .bay-slot {
      aspect-ratio: 1;
      border: 1px solid #ccc;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.9em;
    }

    .bay-slot.available {
      background: #d4edda;
      border-color: #28a745;
      color: #155724;
    }

    .bay-slot.occupied {
      background: #f8d7da;
      border-color: #dc3545;
      color: #721c24;
      cursor: not-allowed;
    }

    .bay-slot.maintenance {
      background: #e2d9f3;
      border-color: #6f42c1;
      color: #3d2461;
      cursor: not-allowed;
    }

    .bay-slot.selected {
      background: #333 !important;
      border-color: #333 !important;
      color: #fff !important;
      transform: scale(1.05);
    }

    .legend {
      display: flex;
      justify-content: space-around;
      margin-top: 12px;
      font-size: 0.85em;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-color {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      border: 1px solid #333;
    }

    .confirmation {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: #fafafa;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 15px;
    }

    .confirm-checkbox {
      width: 20px;
      height: 20px;
      accent-color: #333;
    }

    .submit-btn {
      background: #333;
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s ease;
      width: 100%;
    }

    .submit-btn:hover:not(:disabled) {
      background: #555;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .selected-bay-info {
      background: #fdfdfe;
      border: 1px solid #ccc;
      padding: 12px;
      border-radius: 6px;
      margin-top: 12px;
      font-weight: 500;
      color: #333;
    }

    /* Mobile Responsive Design */
    @media (max-width: 768px) {
      body {
        padding: 5px;
      }
      
      .container {
        max-width: 100%;
        margin: 0;
        border-radius: 12px;
      }
      
      .header {
        padding: 15px;
      }
      
      .header h1 {
        font-size: 16px;
      }
      
      .header p {
        font-size: 13px;
      }
      
      .main-content {
        padding: 15px;
        gap: 15px;
      }
      
      .form-section, .map-section {
        padding: 15px;
      }
      
      .section-title {
        font-size: 15px;
      }
      
      .bay-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        padding: 12px;
      }
      
      .bay-slot {
        font-size: 0.8em;
        padding: 8px 4px;
      }
      
      input, select, textarea, button {
        font-size: 16px; /* Prevents zoom on iOS */
        padding: 14px;
      }
      
      .submit-btn {
        padding: 16px;
        font-size: 16px;
        min-height: 50px;
      }
    }
    
    @media (max-width: 480px) {
      .container {
        border-radius: 8px;
      }
      
      .header {
        padding: 12px;
      }
      
      .header h1 {
        font-size: 15px;
      }
      
      .header p {
        font-size: 12px;
      }
      
      .main-content {
        padding: 12px;
        gap: 12px;
      }
      
      .form-section, .map-section {
        padding: 12px;
      }
      
      .section-title {
        font-size: 14px;
      }
      
      .bay-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
        padding: 10px;
      }
      
      .bay-slot {
        font-size: 0.75em;
        padding: 6px 2px;
      }
      
      input, select, textarea, button {
        padding: 12px;
        font-size: 16px;
      }
      
      .submit-btn {
        padding: 14px;
        font-size: 15px;
        min-height: 45px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Yard Master Control</h1>
      <p>Stabling Bay Assignment & Shunting Management</p>
    </div>

    <div class="main-content">
      <!-- Form Section -->
      <div class="form-section">
        <h2 class="section-title">Assignment Details</h2>
        
        <div class="form-group">
          <label for="depot-id">Depot ID</label>
          <input type="text" id="depot-id" class="auto-field" readonly value="AUTO123">
        </div>

        <div class="form-group">
          <label for="train-number">Train Number</label>
          <input type="text" id="train-number" placeholder="Enter Train Number">
        </div>

        <div class="form-group qr-scanner">
          <input type="text" placeholder="Enter QR Code / ID manually">
          <!-- QR Scan button REMOVED -->
          <button class="dropdown-toggle">Select</button>
        </div>

        <div class="form-group">
          <label for="remarks">Remarks</label>
          <textarea id="remarks" rows="3" placeholder="Enter remarks..."></textarea>
        </div>
      </div>

      <!-- Map Section -->
      <div class="map-section">
        <h2 class="section-title">Interactive Bay Map</h2>

        <div class="bay-selector">
          <div class="selector-tabs">
            <button class="tab-btn active">Line 1</button>
            <button class="tab-btn">Line 2</button>
            <button class="tab-btn">Line 3</button>
          </div>

          <div class="bay-grid">
            <div class="bay-slot available">B1</div>
            <div class="bay-slot occupied">B2</div>
            <div class="bay-slot maintenance">B3</div>
            <div class="bay-slot available">B4</div>
          </div>

          <div class="legend">
            <div class="legend-item"><span class="legend-color" style="background:#d4edda; border-color:#28a745;"></span> Available</div>
            <div class="legend-item"><span class="legend-color" style="background:#f8d7da; border-color:#dc3545;"></span> Occupied</div>
            <div class="legend-item"><span class="legend-color" style="background:#e2d9f3; border-color:#6f42c1;"></span> Maintenance</div>
          </div>
        </div>

        <div class="confirmation">
          <input type="checkbox" class="confirm-checkbox">
          <label>I confirm the bay assignment</label>
        </div>

        <div class="selected-bay-info">Selected Bay: None</div>
        <button class="submit-btn" disabled>Submit Assignment</button>
      </div>
    </div>
  </div>
</body>
</html>
