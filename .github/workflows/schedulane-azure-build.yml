name: schedulane-azure-build
# Builds Dockerfile.azure and pushes ghcr.io/<owner>/schedulane:<tag>.
# A one-time bootstrap step first commits the deploy fixes (see commit message).
on:
  push:
    branches: [deploy-schedulane]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Commit deploy fixes (one-time bootstrap)
        run: |
          if [ -f Dockerfile.azure ]; then echo "already applied"; exit 0; fi
          # 1. Linux case-sensitivity: file names must match their imports
          git mv src/pages/adminpage.jsx src/pages/AdminPage.jsx
          cd src/components/workers
          git mv cleaning.jsx Cleaning.jsx; git mv yard.jsx Yard.jsx; git mv login.jsx Login.jsx
          cd ../../..
          # 2. Restore public/ assets (images, csv data, charts) from repo history
          D=deploy-68d2c9b20b250a70ce364b22
          mkdir -p public
          git archive 2bc4797 $D | tar -x -C /tmp
          cp -r /tmp/$D/. public/
          rm -rf public/assets public/netlify.toml public/index.html public/annotates
          # 3. Regenerate the out-of-sync lockfile
          npm install --package-lock-only --no-audit --no-fund
          # 4. Text changes: .gitignore, requirements, schedule_store CSV schema, Dockerfile.azure
          echo '' | base64 -d | gunzip > /tmp/sl.patch
          git apply /tmp/sl.patch
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Schedulane Azure deploy: fix file-name case, restore public/ assets from 2bc4797, sync lockfile, CSV schema + python-multipart fixes, Dockerfile.azure"
          git push origin HEAD:deploy-schedulane
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr A-Z a-z)
          TAG=sl-$(git rev-parse --short HEAD)
          docker build -f Dockerfile.azure -t ghcr.io/$OWNER/schedulane:$TAG -t ghcr.io/$OWNER/schedulane:latest .
          docker push ghcr.io/$OWNER/schedulane:$TAG
          docker push ghcr.io/$OWNER/schedulane:latest
          echo "pushed tag $TAG"
